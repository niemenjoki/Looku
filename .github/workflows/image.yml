# Builds the Docker image and publishes it in the GitHub container registry
# (ghcr.io/niemenjoki/looku) when a version tag such as v1.0.0 is pushed.
# Tags: 1.0.0, 1.0, 1 and latest (latest only for releases, not for
# pre-releases such as v1.1.0-rc.1). amd64 and arm64 (for example a Raspberry Pi).
# The first time, make the package public: your profile → Packages → looku →
# Package settings → Change visibility → Public.
name: Docker image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/niemenjoki/looku
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
